<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="&quot;JetBrains Mono&quot;,ui-monospace,Consolas,monospace">
  <!-- Background -->
  <rect width="760" height="400" fill="#121212" rx="4"/>

  <!-- Title bar -->
  <rect width="760" height="44" fill="#1e1e1e" rx="4"/>
  <rect x="0" y="28" width="760" height="16" fill="#1e1e1e"/>
  <text x="380" y="28" fill="#ffd60a" font-size="13" text-anchor="middle" font-weight="bold" letter-spacing="0.5">Same injection string — two parsers, two outcomes</text>

  <!-- Section headers -->
  <rect x="1" y="44" width="378" height="34" fill="#1a1a1a"/>
  <text x="189" y="68" fill="#efe9d6" font-size="11.5" text-anchor="middle" font-weight="bold">FULL-PAGE HTML PARSE (SSR)</text>
  <rect x="381" y="44" width="378" height="34" fill="#1a1a1a"/>
  <text x="570" y="68" fill="#efe9d6" font-size="11.5" text-anchor="middle" font-weight="bold">innerHTML FRAGMENT PARSE</text>

  <!-- Center divider -->
  <line x1="380" y1="44" x2="380" y2="400" stroke="#2b2b2b" stroke-width="1.5"/>

  <!-- === LEFT PANEL: Full-page parse === -->

  <!-- Stack label -->
  <text x="20" y="104" fill="#8c8670" font-size="11">open elements stack before inject:</text>

  <!-- Stack boxes (bottom to top) -->
  <rect x="20" y="110" width="200" height="22" fill="#1e1e1e" stroke="#2b2b2b" stroke-width="1"/>
  <text x="30" y="126" fill="#8c8670" font-size="10.5">div.page</text>
  <rect x="30" y="132" width="200" height="22" fill="#1e1e1e" stroke="#2b2b2b" stroke-width="1"/>
  <text x="40" y="148" fill="#efe9d6" font-size="10.5">header</text>
  <rect x="40" y="154" width="200" height="22" fill="#1e1e1e" stroke="#2b2b2b" stroke-width="1"/>
  <text x="50" y="170" fill="#efe9d6" font-size="10.5">section.toolbar  ← MarkdownBar</text>
  <rect x="50" y="176" width="200" height="22" fill="#1e1e1e" stroke="#2b2b2b" stroke-width="1"/>
  <text x="60" y="192" fill="#efe9d6" font-size="10.5">div  ← Toolbar children</text>
  <rect x="60" y="198" width="200" height="22" fill="#1e1e1e" stroke="#ffd60a" stroke-width="1.5"/>
  <text x="70" y="214" fill="#ffd60a" font-size="10.5">div  ← suppressHydrationWarning</text>
  <text x="265" y="214" fill="#ffd60a" font-size="10" text-anchor="middle">▲ top</text>

  <!-- Injection steps -->
  <text x="20" y="244" fill="#8c8670" font-size="11">inject  &lt;/div&gt;&lt;/section&gt; :</text>
  <text x="20" y="262" fill="#efe9d6" font-size="11">1. &lt;/div&gt;  →  pops suppHydrationWarning div</text>
  <text x="20" y="278" fill="#efe9d6" font-size="11">2. &lt;/section&gt;  →  pops up to &amp; closes toolbar section</text>
  <text x="29" y="294" fill="#8c8670" font-size="10.5">   (HTML5: implicitly closes outer div first)</text>

  <!-- Stack after -->
  <text x="20" y="318" fill="#8c8670" font-size="11">stack now:</text>
  <rect x="20" y="324" width="130" height="22" fill="#1e1e1e" stroke="#2b2b2b" stroke-width="1"/>
  <text x="30" y="340" fill="#8c8670" font-size="10.5">div.page</text>
  <rect x="30" y="346" width="130" height="22" fill="#1e1e1e" stroke="#7bd88f" stroke-width="1.5"/>
  <text x="40" y="362" fill="#7bd88f" font-size="10.5">header  ← top</text>

  <!-- Result -->
  <rect x="20" y="376" width="340" height="22" fill="#0d2010" stroke="#7bd88f" stroke-width="1"/>
  <text x="30" y="392" fill="#7bd88f" font-size="11">content lands at header level  ✓</text>

  <!-- === RIGHT PANEL: Fragment parse === -->
  <text x="400" y="104" fill="#8c8670" font-size="11">context element:  &lt;div&gt;  (the suppHydWarn div)</text>
  <text x="400" y="122" fill="#8c8670" font-size="11">open elements stack: (empty — only context is set)</text>

  <!-- Fragment parser steps -->
  <text x="400" y="162" fill="#8c8670" font-size="11">inject  &lt;/div&gt;&lt;/section&gt; :</text>

  <!-- Step 1 -->
  <rect x="400" y="170" width="340" height="40" fill="#1e1e1e" stroke="#2b2b2b" stroke-width="1"/>
  <text x="412" y="187" fill="#efe9d6" font-size="11">1. &lt;/div&gt;</text>
  <text x="412" y="204" fill="#ff5c5c" font-size="10.5">   no &lt;div&gt; on stack  →  IGNORED</text>

  <!-- Step 2 -->
  <rect x="400" y="216" width="340" height="40" fill="#1e1e1e" stroke="#2b2b2b" stroke-width="1"/>
  <text x="412" y="233" fill="#efe9d6" font-size="11">2. &lt;/section&gt;</text>
  <text x="412" y="250" fill="#ff5c5c" font-size="10.5">   no &lt;section&gt; on stack  →  IGNORED</text>

  <!-- Step 3: content goes into div -->
  <rect x="400" y="262" width="340" height="40" fill="#1e1e1e" stroke="#2b2b2b" stroke-width="1"/>
  <text x="412" y="279" fill="#efe9d6" font-size="11">3. &lt;p&gt;hello&lt;/p&gt;</text>
  <text x="412" y="296" fill="#efe9d6" font-size="10.5">   inserted as child of context div</text>

  <!-- Visual trap -->
  <rect x="400" y="316" width="340" height="44" fill="#1e1e1e" stroke="#2b2b2b" stroke-width="1" rx="2"/>
  <text x="414" y="334" fill="#8c8670" font-size="10.5">div [context]</text>
  <rect x="420" y="338" width="130" height="18" fill="#2a1010" stroke="#ff5c5c" stroke-width="1"/>
  <text x="430" y="351" fill="#ff5c5c" font-size="10.5">&lt;p&gt;hello&lt;/p&gt;  ← trapped</text>

  <!-- Result -->
  <rect x="400" y="376" width="340" height="22" fill="#2a1010" stroke="#ff5c5c" stroke-width="1"/>
  <text x="410" y="392" fill="#ff5c5c" font-size="11">content trapped inside div  ✗</text>
</svg>
