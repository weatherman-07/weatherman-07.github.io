<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="&quot;JetBrains Mono&quot;,ui-monospace,Consolas,monospace">
  <!-- Background -->
  <rect width="760" height="420" fill="#121212" rx="4"/>

  <!-- Title bar -->
  <rect width="760" height="44" fill="#1e1e1e" rx="4"/>
  <rect x="0" y="28" width="760" height="16" fill="#1e1e1e"/>
  <text x="380" y="28" fill="#ffd60a" font-size="13" text-anchor="middle" font-weight="bold" letter-spacing="0.5">React hydration: RSC payload tree ↔ DOM childNodes (by position)</text>

  <!-- Column headers -->
  <rect x="1" y="44" width="338" height="34" fill="#1a1a1a"/>
  <text x="170" y="68" fill="#efe9d6" font-size="11.5" text-anchor="middle" font-weight="bold">RSC PAYLOAD  (server component tree)</text>
  <rect x="421" y="44" width="338" height="34" fill="#1a1a1a"/>
  <text x="590" y="68" fill="#efe9d6" font-size="11.5" text-anchor="middle" font-weight="bold">DOM  (browser-parsed SSR HTML)</text>

  <!-- Center arrow column -->
  <rect x="339" y="44" width="82" height="34" fill="#1a1a1a"/>
  <text x="380" y="68" fill="#8c8670" font-size="10" text-anchor="middle">React walks</text>
  <text x="380" y="80" fill="#8c8670" font-size="10" text-anchor="middle">in parallel →</text>

  <!-- === RSC PAYLOAD TREE === -->
  <!-- div.page -->
  <text x="20" y="106" fill="#8c8670" font-size="11">div.page</text>
  <!-- header -->
  <text x="34" y="126" fill="#efe9d6" font-size="11">header</text>
  <!-- sections -->
  <text x="52" y="148" fill="#efe9d6" font-size="11">[0] CounterBar</text>
  <text x="52" y="168" fill="#efe9d6" font-size="11">[1] RotatorBar</text>
  <!-- MarkdownBar -->
  <text x="52" y="188" fill="#efe9d6" font-size="11">[2] MarkdownBar</text>
  <text x="68" y="206" fill="#8c8670" font-size="10">└ innerHTML reassign</text>
  <!-- CalcBar - highlighted -->
  <rect x="46" y="216" width="260" height="24" fill="#1a1200" stroke="#ffd60a" stroke-width="1.5" rx="2"/>
  <text x="52" y="233" fill="#ffd60a" font-size="11">[3] CalcBar  ← client component</text>
  <!-- CalcBar internals -->
  <text x="68" y="254" fill="#8c8670" font-size="10">└ section.toolbar</text>
  <text x="84" y="270" fill="#8c8670" font-size="10">└ div [children]</text>
  <text x="100" y="286" fill="#8c8670" font-size="10">├ input  ref={input}</text>
  <text x="100" y="302" fill="#8c8670" font-size="10">├ " = " (text)</text>
  <text x="100" y="318" fill="#8c8670" font-size="10">└ code</text>

  <!-- main -->
  <text x="34" y="344" fill="#efe9d6" font-size="11">main</text>
  <text x="52" y="362" fill="#8c8670" font-size="10">h1, h3</text>

  <!-- === DOM TREE === -->
  <!-- div.page -->
  <text x="440" y="106" fill="#8c8670" font-size="11">div.page</text>
  <!-- header -->
  <text x="454" y="126" fill="#efe9d6" font-size="11">header</text>
  <!-- sections -->
  <text x="472" y="148" fill="#efe9d6" font-size="11">[0] section.toolbar</text>
  <text x="472" y="168" fill="#efe9d6" font-size="11">[1] section.toolbar</text>
  <!-- MarkdownBar -->
  <text x="472" y="188" fill="#efe9d6" font-size="11">[2] section.toolbar</text>
  <text x="488" y="206" fill="#ff5c5c" font-size="10">└ div &lt;!-- injection trapped here --&gt;</text>
  <!-- Fake section - highlighted -->
  <rect x="466" y="216" width="274" height="24" fill="#0d2010" stroke="#7bd88f" stroke-width="1.5" rx="2"/>
  <text x="472" y="233" fill="#7bd88f" font-size="11">[3] section.toolbar  ← FAKE (our injection)</text>
  <!-- Fake section internals -->
  <text x="488" y="254" fill="#7bd88f" font-size="10">└ div [children]</text>
  <rect x="503" y="260" width="230" height="22" fill="#0d2010" stroke="#7bd88f" stroke-width="1" rx="2"/>
  <text x="509" y="276" fill="#ffd60a" font-size="10">├ input  value="1+1"  ← .value preserved</text>
  <text x="503" y="296" fill="#7bd88f" font-size="10">├ " = " (text)</text>
  <text x="503" y="312" fill="#7bd88f" font-size="10">└ code</text>

  <!-- main -->
  <text x="454" y="344" fill="#efe9d6" font-size="11">main</text>
  <text x="472" y="362" fill="#8c8670" font-size="10">h1, h3</text>

  <!-- === MATCHING ARROWS (horizontal lines in center) === -->
  <!-- div.page -->
  <line x1="316" y1="102" x2="424" y2="102" stroke="#2b2b2b" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="380" y="99" fill="#2b2b2b" font-size="9" text-anchor="middle">match</text>

  <!-- header -->
  <line x1="316" y1="122" x2="424" y2="122" stroke="#2b2b2b" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- sections 0,1 -->
  <line x1="316" y1="144" x2="424" y2="144" stroke="#2b2b2b" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="316" y1="164" x2="424" y2="164" stroke="#2b2b2b" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- MarkdownBar -->
  <line x1="316" y1="184" x2="424" y2="184" stroke="#2b2b2b" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- CalcBar - highlighted matching arrow -->
  <line x1="316" y1="228" x2="424" y2="228" stroke="#ffd60a" stroke-width="2"/>
  <polygon points="420,224 430,228 420,232" fill="#ffd60a"/>
  <polygon points="320,224 310,228 320,232" fill="#ffd60a"/>

  <!-- main -->
  <line x1="316" y1="340" x2="424" y2="340" stroke="#2b2b2b" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- === RESULT BOX === -->
  <rect x="20" y="378" width="720" height="36" fill="#1a1200" stroke="#ffd60a" stroke-width="1" rx="2"/>
  <text x="380" y="393" fill="#ffd60a" font-size="11" text-anchor="middle">React attaches  input.current  to our injected &lt;input value="1+1"&gt;</text>
  <text x="380" y="410" fill="#efe9d6" font-size="11" text-anchor="middle">useEffect fires → setCode("1+1") → eval("1+1") = 2  ✓</text>
</svg>
